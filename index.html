    <!-- ============================================================
         ⚙️ CONFIGURACIÓN DE GITHUB — ¡EDITA SOLO ESTAS 4 LÍNEAS!

    <script>
        window.GITHUB_CONFIG = {
            owner:  "matias3196189-prog",                 // 👈 tu usuario de GitHub
            repo:   "matias3196189-prog.github.io",       // 👈 tu repositorio
            branch: "main",                                // 👈 "main" o "master"
            path:   "data.json",                           // 👈 archivo donde se guardan los autos
            token:  "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"   // 👈 tu token fine-grained
        };

        // 🔁 Sincronización automática: cada 20 segundos revisa si hay cambios
        //    en GitHub (por si otro dispositivo guardó algo). Ponlo en 0 para desactivar.
        window.SYNC_INTERVAL_MS = 20000;
    </script>

    <script>
        class MechanicalApp {
            constructor() {
                this.isAdmin = false;
                this.vehicles = [];
                this.currentPhotoBase64 = '';
                this.activeVehicleIdForQR = null;
                this.cloudEnabled = false;
                this.ready = false;
                this.currentSha = null;    // SHA del archivo (necesario para actualizar en GitHub)
                this.syncTimer = null;
                this.storageKey = 'pobreJose_vehicles';
                this.lastJsonHash = '';    // para no repintar si no hubo cambios
            }

            init() {
                if (sessionStorage.getItem('pobreJose_admin') === 'true') {
                    this.isAdmin = true;
                    this.updateAdminUI(true);
                }

                const cached = localStorage.getItem(this.storageKey);
                if (cached) {
                    try { this.vehicles = JSON.parse(cached) || []; } catch (e) { this.vehicles = []; }
                }

                const cloudStarted = this.initCloud();

                if (!cloudStarted) {
                    this.ready = true;
                    if (this.vehicles.length === 0) this.seedDemoVehicle();
                    this.setStatus('local');
                    this.render();
                }

                window.addEventListener('popstate', () => this.render());
                this.checkConfigWarning();
            }

            /* ============ GITHUB STORAGE ============ */
            isGithubConfigured() {
                const c = window.GITHUB_CONFIG || {};
                return c.owner && c.repo && c.token && c.token.indexOf('PEGA_AQUI') === -1 && c.token.startsWith('github_pat_');
            }

            initCloud() {
                if (!this.isGithubConfigured()) {
                    console.warn('[Modo local] GitHub no está configurado.');
                    return false;
                }

                this.cloudEnabled = true;
                this.setStatus('connecting');
                this.ready = false;

                this.loadFromGitHub().then(() => {
                    this.ready = true;
                    this.setStatus('cloud');
                    this.render();
                    this.startAutoSync();
                }).catch(err => {
                    console.error('GitHub error:', err);
                    this.ready = true;
                    this.setStatus('error', err.message);
                    this.render();
                });

                return true;
            }

            // Lee data.json desde el repo
            async loadFromGitHub(silent = false) {
                const c = window.GITHUB_CONFIG;
                const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}?ref=${c.branch}&t=${Date.now()}`;

                const res = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${c.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (res.status === 404) {
                    // El archivo aún no existe -> lo creamos vacío
                    this.vehicles = [];
                    this.currentSha = null;
                    if (!silent) {
                        try { await this.writeToGitHub([]); } catch (e) { console.warn(e); }
                    }
                    return;
                }

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(`GitHub ${res.status}: ${err.message || 'error leyendo data.json'}`);
                }

                const json = await res.json();
                this.currentSha = json.sha;

                const decoded = this.b64DecodeUnicode(json.content.replace(/\n/g, ''));
                let list = [];
                try { list = JSON.parse(decoded) || []; } catch (e) { list = []; }

                // Detectar si cambió respecto a lo que ya teníamos (para no repintar en cada poll)
                const hash = JSON.stringify(list);
                const changed = hash !== this.lastJsonHash;

                if (changed) {
                    this.vehicles = list;
                    this.lastJsonHash = hash;
                    localStorage.setItem(this.storageKey, JSON.stringify(list));
                    if (silent) this.render(); // refrescar UI sin spinners
                }

                return changed;
            }

            // Escribe data.json en el repo (crea commit)
            async writeToGitHub(list) {
                const c = window.GITHUB_CONFIG;
                const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path}`;

                const content = this.b64EncodeUnicode(JSON.stringify(list, null, 2));

                // Si no tenemos SHA, lo pedimos antes (necesario para UPDATE)
                if (!this.currentSha) {
                    try {
                        const head = await fetch(url + `?ref=${c.branch}&t=${Date.now()}`, {
                            headers: { 'Authorization': `Bearer ${c.token}`, 'Accept': 'application/vnd.github.v3+json' }
                        });
                        if (head.ok) {
                            const hj = await head.json();
                            this.currentSha = hj.sha;
                        }
                    } catch (e) { /* archivo nuevo, no pasa nada */ }
                }

                const body = {
                    message: `Actualizar vehículos (${new Date().toLocaleString('es-CL')})`,
                    content,
                    branch: c.branch
                };
                if (this.currentSha) body.sha = this.currentSha;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${c.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.status === 409) {
                    // Conflicto: alguien guardó al mismo tiempo. Reintentamos 1 vez.
                    const head = await fetch(url + `?ref=${c.branch}&t=${Date.now()}`, {
                        headers: { 'Authorization': `Bearer ${c.token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const hj = await head.json();
                    this.currentSha = hj.sha;
                    body.sha = this.currentSha;

                    const retry = await fetch(url, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${c.token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });
                    if (!retry.ok) {
                        const err = await retry.json().catch(() => ({}));
                        throw new Error(err.message || 'Conflicto al guardar');
                    }
                    const out = await retry.json();
                    this.currentSha = out.content.sha;
                    return out;
                }

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(`GitHub ${res.status}: ${err.message || 'error guardando'}`);
                }

                const json = await res.json();
                this.currentSha = json.content.sha;
                this.lastJsonHash = JSON.stringify(list);
                return json;
            }

            startAutoSync() {
                if (this.syncTimer) clearInterval(this.syncTimer);

                    if (document.getElementById('saveVehicleBtn')?.disabled) return;
                    try {

            b64DecodeUnicode(str) {

            async handlePhotoUpload(event) {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const compressed = await this.compressImage(file, 900, 0.72);
                    this.currentPhotoBase64 = compressed;
                    document.getElementById('vPhotoPreview').src = compressed;
                    document.getElementById('vPhotoPreview').classList.remove('hidden');
                    document.getElementById('vPhotoPlaceholder').classList.add('hidden');
                    const kb = Math.round(compressed.length * 0.75 / 1024);
                    if (kb > 400) alert('La imagen pesa ~' + kb + ' KB. Recomendado < 300 KB para que el JSON no crezca demasiado.');
                } catch (err) {
                    console.error(err);
                    alert('No se pudo procesar la imagen.');
                }
            }

            compressImage(file, maxWidth, quality) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            let { width, height } = img;
                            if (width > maxWidth) {
                                height = Math.round(height * maxWidth / width);
                                width = maxWidth;
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, width, height);
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', quality));
                        };
                        img.onerror = reject;
                        img.src = e.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

                e.preventDefault();
                const btn = document.getElementById('saveVehicleBtn');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Subiendo a GitHub...';

                const id = document.getElementById('vehicleId').value || ('v_' + Date.now());
                const existing = this.vehicles.find(v => v.id === id);

                const vehicleData = {
                    id: id,
                    plate: document.getElementById('vPlate').value.toUpperCase().trim(),
                    owner: document.getElementById('vOwner').value.trim(),
                    model: document.getElementById('vModel').value.trim(),
                    mileage: document.getElementById('vMileage').value,
                    oilChange: document.getElementById('vOilChange').value.trim(),
                    filters: document.getElementById('vFilters').value.trim(),
                    nextService: document.getElementById('vNextService').value.trim(),
                    date: document.getElementById('vDate').value,
                    notes: document.getElementById('vNotes').value.trim(),
                    photo: this.currentPhotoBase64 || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=600&q=80',
                    createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(),
                    updatedAt: Date.now()
                };

                // Actualizamos la lista local
                const idx = this.vehicles.findIndex(v => v.id === id);
                if (idx >= 0) this.vehicles[idx] = vehicleData;
                else this.vehicles.unshift(vehicleData);

                try {
                    if (this.cloudEnabled) {
                        await this.writeToGitHub(this.vehicles);
                    } else {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.vehicles));
                    }
                    this.closeVehicleModal();
                    this.render();
                } catch (err) {
                    console.error(err);
                    alert('❌ Error al guardar en GitHub:\n\n' + err.message +
                        '\n\nVerifica:\n• Que el token tenga permisos "Contents: Read and write".\n• Que el repo y la rama sean correctos.\n• Que data.json exista (o permiso para crearlo).');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }

            async deleteVehicle(id) {
                if (!confirm('¿Está seguro de que desea eliminar este registro de vehículo?')) return;
                this.vehicles = this.vehicles.filter(v => v.id !== id);
                try {
                    if (this.cloudEnabled) {
                        await this.writeToGitHub(this.vehicles);
                    } else {
                        localStorage.setItem(this.storageKey, JSON.stringify(this.vehicles));
                    }
                    this.render();
                } catch (err) {
                    console.error(err);
                    alert('❌ Error al eliminar en GitHub: ' + err.message);
                }
            }

            generateQR(id) {
                const vehicle = this.vehicles.find(v => v.id === id);
                if (!vehicle) return;
                this.activeVehicleIdForQR = id;
                document.getElementById('qrVehiclePlate').innerText = `PATENTE: ${vehicle.plate}`;
                const qrUrl = this.getVehicleUrl(id);
                const qrContainer = document.getElementById('qrcode');
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: qrUrl, width: 140, height: 140,
                    colorDark: '#000000', colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                document.getElementById('qrModal').classList.remove('hidden');
            }

            getVehicleUrl(id) {
                const base = window.location.origin + window.location.pathname;
                return `${base}?v=${id}`;
            }

            closeQRModal() { document.getElementById('qrModal').classList.add('hidden'); }

            openVehicleInNewTab() {
                if (this.activeVehicleIdForQR) {
                    window.open(this.getVehicleUrl(this.activeVehicleIdForQR), '_blank');
                }
            }

            copyQRLink() {
                if (!this.activeVehicleIdForQR) return;
                const fullLink = this.getVehicleUrl(this.activeVehicleIdForQR);
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = fullLink;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                alert('¡Enlace directo copiado al portapapeles!\n\n' + fullLink);
            }

            esc(str) {
                if (str === undefined || str === null) return '';
                return String(str)
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }
        }

        let app;
        window.onload = function () { app = new MechanicalApp(); app.init(); };
    </script>
</body>
</html>
