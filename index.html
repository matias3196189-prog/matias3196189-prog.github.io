<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Pobre José - Taller Mecánico</title>
  <!-- Google Fonts: Orbitron y Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary-red: #ff002b;
      --red-glow: rgba(255, 0, 43, 0.5);
      --bg-dark: #08080a;
      --card-bg: rgba(18, 18, 24, 0.85);
      --border-color: #2a2a36;
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --silver: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 0, 43, 0.15), transparent 70%),
        linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(8,8,10,0.95));
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(12, 12, 16, 0.9);
      border-bottom: 2px solid var(--primary-red);
      box-shadow: 0 4px 20px rgba(255, 0, 43, 0.2);
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-img {
      height: 50px;
      width: auto;
      filter: drop-shadow(0 0 8px var(--red-glow));
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 0%, var(--silver) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: var(--primary-red);
      font-size: 0.75rem;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .admin-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: linear-gradient(135deg, #1a1a24 0%, #0d0d12 100%);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .btn:hover {
      border-color: var(--primary-red);
      box-shadow: 0 0 10px var(--red-glow);
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff002b 0%, #b3001e 100%);
      border: none;
      color: #fff;
      box-shadow: 0 0 10px var(--red-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #ff264a 0%, #d60024 100%);
      box-shadow: 0 0 20px var(--red-glow);
    }

    .btn-danger {
      border-color: #ff3333;
      color: #ff3333;
    }

    .btn-danger:hover {
      background: #ff3333;
      color: #fff;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }

    /* Modales y Formularios */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--primary-red);
      box-shadow: 0 0 30px rgba(255, 0, 43, 0.3);
      border-radius: 12px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--primary-red);
      font-size: 1.2rem;
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-modal:hover { color: #fff; }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: var(--silver);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(10, 10, 14, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary-red);
      box-shadow: 0 0 8px var(--red-glow);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    /* Grilla de Vehículos */
    .vehicles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .vehicle-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
    }

    .vehicle-card:hover {
      border-color: var(--primary-red);
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5), 0 0 15px rgba(255,0,43,0.2);
    }

    .vehicle-img-container {
      width: 100%;
      height: 200px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .vehicle-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .vehicle-body {
      padding: 1.2rem;
    }

    .vehicle-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plate-badge {
      background: var(--primary-red);
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .info-list {
      list-style: none;
      margin: 1rem 0;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      font-size: 0.95rem;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      font-weight: 600;
      color: var(--silver);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    /* Vista Pública del Vehículo */
    .public-view {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--primary-red);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 30px var(--red-glow);
    }

    /* Estilos del Contenedor QR */
    .qr-modal-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      text-align: center;
    }

    .qr-display-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: #fff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      max-width: 100%;
      flex-wrap: wrap;
    }

    .qr-logo {
      max-width: 120px;
      height: auto;
    }

    #qrcode img {
      margin: 0 auto;
    }

    .search-bar {
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
    }

    /* Mensaje de Restricción / Login Screen */
    .access-denied-container {
      text-align: center;
      padding: 4rem 1rem;
      max-width: 450px;
      margin: 0 auto;
    }

    .access-denied-icon {
      font-size: 4rem;
      color: var(--primary-red);
      margin-bottom: 1rem;
      text-shadow: 0 0 20px var(--red-glow);
    }

    .access-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .access-subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .header-container { flex-direction: column; text-align: center; }
      .qr-display-container { flex-direction: column; gap: 1rem; }
      .search-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Header principal -->
  <header>
    <div class="header-container">
      <div class="logo-container" onclick="resetToHome()">
        <img src="https://i.ibb.co/L89Y32C/WhatsApp-Image-2026-10-05-at-6-59-50-PM.jpg" alt="El Pobre José Logo" class="logo-img">
        <div>
          <div class="brand-title">El Pobre José</div>
          <div class="brand-subtitle">TALLER MECÁNICO</div>
        </div>
      </div>
      <div class="admin-controls" id="adminControls">
        <!-- Se llena con JS según el estado de sesión -->
      </div>
    </div>
  </header>

  <main id="mainContainer">
    <!-- El contenido se inyecta dinámicamente -->
  </main>

  <!-- Modal Login -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-lock"></i> Acceso Administrativo</h3>
        <button class="close-modal" onclick="closeModal('loginModal')">&times;</button>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="loginUser" class="form-control" required placeholder="Ingresa usuario">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPass" class="form-control" required placeholder="Ingresa contraseña">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <!-- Modal Agregar / Editar Vehículo -->
  <div class="modal" id="vehicleModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="vehicleModalTitle">Agregar Vehículo</h3>
        <button class="close-modal" onclick="closeModal('vehicleModal')">&times;</button>
      </div>
      <form onsubmit="saveVehicle(event)">
        <input type="hidden" id="vehId">
        <div class="form-group">
          <label>Modelo / Auto</label>
          <input type="text" id="vehModel" class="form-control" placeholder="Ej: Toyota Hilux 2.4" required>
        </div>
        <div class="form-group">
          <label>Patente / Dominio</label>
          <input type="text" id="vehPlate" class="form-control" placeholder="Ej: BB-CL-10" required>
        </div>
        <div class="form-group">
          <label>Foto del Vehículo</label>
          <input type="file" id="vehFoto" class="form-control" accept="image/*" onchange="previewImage(event)">
          <input type="hidden" id="vehFotoBase64">
        </div>
        <div class="form-group">
          <label>Kilometraje Actual (KM)</label>
          <input type="number" id="vehKm" class="form-control" placeholder="Ej: 125000" required>
        </div>
        <div class="form-group">
          <label>Cambio de Aceite Realizado</label>
          <input type="text" id="vehOil" class="form-control" placeholder="Ej: 10W-40 Sintético + Filtro" required>
        </div>
        <div class="form-group">
          <label>Filtros Cambiados</label>
          <input type="text" id="vehFilters" class="form-control" placeholder="Ej: Aceite, Aire y Polencito">
        </div>
        <div class="form-group">
          <label>Próximo Servicio Recomendado</label>
          <input type="text" id="vehNextService" class="form-control" placeholder="Ej: A los 135,000 KM o en 6 meses" required>
        </div>
        <div class="form-group">
          <label>Notas Opcionales / Observaciones</label>
          <textarea id="vehNotes" class="form-control" placeholder="Ej: Se observa ligera sudoración en empaque de punterías."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Guardar Registro</button>
      </form>
    </div>
  </div>

  <!-- Modal Código QR -->
  <div class="modal" id="qrModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title"><i class="fas fa-qrcode"></i> Ficha QR - Vehículo</h3>
        <button class="close-modal" onclick="closeModal('qrModal')">&times;</button>
      </div>
      <div class="qr-modal-body">
        <p style="color: var(--text-muted); font-size: 0.9rem;">Escanea este código o abre el enlace para acceder a la ficha técnica guardada:</p>
        
        <!-- Tarjeta QR + Logo -->
        <div class="qr-display-container">
          <img src="https://i.ibb.co/L89Y32C/WhatsApp-Image-2026-10-05-at-6-59-50-PM.jpg" alt="Logo Taller" class="qr-logo">
          <div id="qrcode"></div>
        </div>

        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; width: 100%;">
          <button class="btn btn-primary" onclick="openQrUrl()"><i class="fas fa-external-link-alt"></i> Abrir Ficha</button>
          <button class="btn" onclick="copyQrUrl()"><i class="fas fa-copy"></i> Copiar Enlace</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 El Pobre José - Taller Mecánico | Sistema de Control Mantenimiento Vehicular
  </footer>

  <script>
    // Estado de la aplicación
    let isAdmin = localStorage.getItem('pobreJose_isAdmin') === 'true';
    let currentQrUrl = '';

    // Cargar vehículos desde localStorage
    function getVehicles() {
      const stored = localStorage.getItem('pobreJose_vehicles');
      return stored ? JSON.parse(stored) : [];
    }

    // Guardar lista en localStorage
    function saveVehiclesData(data) {
      localStorage.setItem('pobreJose_vehicles', JSON.stringify(data));
    }

    // Inicio de la aplicación
    document.addEventListener('DOMContentLoaded', () => {
      renderHeaderControls();
      checkRoute();
    });

    // Control de rutas por la URL
    function checkRoute() {
      const urlParams = new URLSearchParams(window.location.search);
      const vehicleParam = urlParams.get('v');
      const dataParam = urlParams.get('data');

      if (dataParam) {
        // Modo URL con datos incrustados (Base64) para GitHub Pages
        try {
          const jsonString = decodeURIComponent(escape(atob(dataParam)));
          const vehicleObj = JSON.parse(jsonString);
          renderPublicVehicleView(vehicleObj);
          return;
        } catch (e) {
          console.error("Error al decodificar datos del vehículo", e);
        }
      }

      if (vehicleParam) {
        // Modo consulta por ID
        const vehicles = getVehicles();
        const vehicle = vehicles.find(v => v.id === vehicleParam);
        if (vehicle) {
          renderPublicVehicleView(vehicle);
        } else {
          document.getElementById('mainContainer').innerHTML = `
            <div style="text-align: center; padding: 3rem;">
              <h2><i class="fas fa-exclamation-triangle" style="color: var(--primary-red);"></i> Vehículo No Encontrado</h2>
              <p style="color: var(--text-muted); margin-top: 1rem;">No se encontraron registros asociados a este enlace.</p>
            </div>
          `;
        }
      } else {
        // Ruta Principal
        if (isAdmin) {
          renderAdminDashboard();
        } else {
          renderLoginPrompt();
        }
      }
    }

    function renderHeaderControls() {
      const container = document.getElementById('adminControls');
      if (isAdmin) {
        container.innerHTML = `
          <button class="btn btn-primary" onclick="openAddVehicleModal()"><i class="fas fa-plus"></i> Nuevo Auto</button>
          <button class="btn btn-danger" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Salir</button>
        `;
      } else {
        container.innerHTML = `
          <button class="btn" onclick="openModal('loginModal')"><i class="fas fa-user-shield"></i> Acceso Admin</button>
        `;
      }
    }

    // Renderiza la pantalla de bloqueo para usuarios no administradores
    function renderLoginPrompt() {
      const container = document.getElementById('mainContainer');
      container.innerHTML = `
        <div class="access-denied-container">
          <div class="access-denied-icon">
            <i class="fas fa-shield-alt"></i>
          </div>
          <h2 class="access-title">SISTEMA PRIVADO DE TALLER</h2>
          <p class="access-subtitle">La lista general está restringida. Inicia sesión como administrador o escanea el código QR de un vehículo específico.</p>
          <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="openModal('loginModal')">
            <i class="fas fa-key"></i> Iniciar Sesión Admin
          </button>
        </div>
      `;
    }

    // Renderiza el catálogo completo para el Administrador
    function renderAdminDashboard() {
      const vehicles = getVehicles();
      const container = document.getElementById('mainContainer');

      let html = `
        <div class="search-bar">
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar por modelo o patente..." onkeyup="filterVehicles()">
        </div>
        <div class="vehicles-grid" id="vehiclesGrid">
      `;

      if (vehicles.length === 0) {
        html += `
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem; background: var(--card-bg); border-radius: 10px;">
            <i class="fas fa-car" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i>
            <h3>No hay vehículos registrados</h3>
            <p style="color: var(--text-muted);">Presiona "Nuevo Auto" para agregar el primer registro.</p>
          </div>
        `;
      } else {
        vehicles.forEach(v => {
          html += createVehicleCardHTML(v);
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function createVehicleCardHTML(v) {
      const defaultImg = 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=600';
      return `
        <div class="vehicle-card" data-search="${v.model.toLowerCase()} ${v.plate.toLowerCase()}">
          <div class="vehicle-img-container">
            <img src="${v.photo || defaultImg}" alt="${v.model}" class="vehicle-img">
          </div>
          <div class="vehicle-body">
            <div class="vehicle-title">
              <span>${v.model}</span>
              <span class="plate-badge">${v.plate}</span>
            </div>
            <ul class="info-list">
              <li class="info-item"><span class="info-label">Kilometraje:</span><span class="info-value">${Number(v.km).toLocaleString()} KM</span></li>
              <li class="info-item"><span class="info-label">Aceite:</span><span class="info-value">${v.oil}</span></li>
              <li class="info-item"><span class="info-label">Filtros:</span><span class="info-value">${v.filters || 'N/A'}</span></li>
              <li class="info-item"><span class="info-label">Próx. Servicio:</span><span class="info-value" style="color: var(--primary-red);">${v.nextService}</span></li>
            </ul>
            ${v.notes ? `<p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;"><strong>Nota:</strong> ${v.notes}</p>` : ''}
            
            <div class="card-actions">
              <button class="btn btn-primary" style="flex:1;" onclick="generateQR('${v.id}')"><i class="fas fa-qrcode"></i> QR</button>
              <button class="btn" onclick="openEditVehicleModal('${v.id}')"><i class="fas fa-edit"></i></button>
              <button class="btn btn-danger" onclick="deleteVehicle('${v.id}')"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>
      `;
    }

    // Renderiza la vista pública exclusiva de un auto
    function renderPublicVehicleView(v) {
      const container = document.getElementById('mainContainer');
      const defaultImg = 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=600';

      container.innerHTML = `
        <div class="public-view">
          <div class="vehicle-img-container" style="height: 280px;">
            <img src="${v.photo || defaultImg}" alt="${v.model}" class="vehicle-img">
          </div>
          <div class="vehicle-body" style="padding: 1.5rem;">
            <div class="vehicle-title" style="font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.8rem;">
              <span>${v.model}</span>
              <span class="plate-badge" style="font-size: 1rem;">${v.plate}</span>
            </div>
            
            <ul class="info-list" style="margin: 1.5rem 0;">
              <li class="info-item" style="padding: 0.7rem 0;"><span class="info-label"><i class="fas fa-tachometer-alt"></i> Kilometraje:</span><span class="info-value">${Number(v.km).toLocaleString()} KM</span></li>
              <li class="info-item" style="padding: 0.7rem 0;"><span class="info-label"><i class="fas fa-oil-can"></i> Cambio de Aceite:</span><span class="info-value">${v.oil}</span></li>
              <li class="info-item" style="padding: 0.7rem 0;"><span class="info-label"><i class="fas fa-filter"></i> Filtros:</span><span class="info-value">${v.filters || 'N/A'}</span></li>
              <li class="info-item" style="padding: 0.7rem 0;"><span class="info-label"><i class="fas fa-calendar-check"></i> Próximo Servicio:</span><span class="info-value" style="color: var(--primary-red); font-weight: bold;">${v.nextService}</span></li>
            </ul>

            ${v.notes ? `
              <div style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 8px; border-left: 3px solid var(--primary-red); margin-bottom: 1.5rem;">
                <strong style="color: var(--silver); display: block; margin-bottom: 0.3rem;">Observaciones del Taller:</strong>
                <p style="color: var(--text-muted); font-size: 0.95rem;">${v.notes}</p>
              </div>
            ` : ''}

            <div style="text-align: center; margin-top: 1.5rem;">
              ${isAdmin ? `
                <button class="btn btn-primary" onclick="resetToHome()"><i class="fas fa-arrow-left"></i> Volver al Panel Admin</button>
              ` : `
                <p style="color: var(--text-muted); font-size: 0.8rem;"><i class="fas fa-check-circle" style="color: #00ff66;"></i> Ficha Mantenimiento Auténtica - El Pobre José</p>
              `}
            </div>
          </div>
        </div>
      `;
    }

    // Modal Handlers
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Login Handler
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPass').value;

      if (user === 'admin' && pass === 'admin') {
        isAdmin = true;
        localStorage.setItem('pobreJose_isAdmin', 'true');
        closeModal('loginModal');
        renderHeaderControls();
        renderAdminDashboard();
      } else {
        alert('Usuario o contraseña incorrectos.');
      }
    }

    function handleLogout() {
      isAdmin = false;
      localStorage.removeItem('pobreJose_isAdmin');
      renderHeaderControls();
      renderLoginPrompt();
    }

    // Procesamiento de Imagen Base64
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('vehFotoBase64').value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // Guardar / Editar Vehículo
    function openAddVehicleModal() {
      document.getElementById('vehId').value = '';
      document.getElementById('vehicleModalTitle').innerText = 'Agregar Vehículo';
      document.getElementById('vehModel').value = '';
      document.getElementById('vehPlate').value = '';
      document.getElementById('vehKm').value = '';
      document.getElementById('vehOil').value = '';
      document.getElementById('vehFilters').value = '';
      document.getElementById('vehNextService').value = '';
      document.getElementById('vehNotes').value = '';
      document.getElementById('vehFotoBase64').value = '';
      openModal('vehicleModal');
    }

    function openEditVehicleModal(id) {
      const vehicles = getVehicles();
      const v = vehicles.find(item => item.id === id);
      if (!v) return;

      document.getElementById('vehId').value = v.id;
      document.getElementById('vehicleModalTitle').innerText = 'Editar Vehículo';
      document.getElementById('vehModel').value = v.model;
      document.getElementById('vehPlate').value = v.plate;
      document.getElementById('vehKm').value = v.km;
      document.getElementById('vehOil').value = v.oil;
      document.getElementById('vehFilters').value = v.filters || '';
      document.getElementById('vehNextService').value = v.nextService;
      document.getElementById('vehNotes').value = v.notes || '';
      document.getElementById('vehFotoBase64').value = v.photo || '';
      openModal('vehicleModal');
    }

    function saveVehicle(e) {
      e.preventDefault();
      const id = document.getElementById('vehId').value || 'veh_' + Date.now();
      const model = document.getElementById('vehModel').value;
      const plate = document.getElementById('vehPlate').value.toUpperCase();
      const km = document.getElementById('vehKm').value;
      const oil = document.getElementById('vehOil').value;
      const filters = document.getElementById('vehFilters').value;
      const nextService = document.getElementById('vehNextService').value;
      const notes = document.getElementById('vehNotes').value;
      const photo = document.getElementById('vehFotoBase64').value;

      const vehicleData = { id, model, plate, km, oil, filters, nextService, notes, photo };

      let vehicles = getVehicles();
      const existingIndex = vehicles.findIndex(v => v.id === id);

      if (existingIndex >= 0) {
        vehicles[existingIndex] = vehicleData;
      } else {
        vehicles.push(vehicleData);
      }

      saveVehiclesData(vehicles);
      closeModal('vehicleModal');
      renderAdminDashboard();
    }

    function deleteVehicle(id) {
      if (confirm('¿Estás seguro de eliminar este vehículo?')) {
        let vehicles = getVehicles();
        vehicles = vehicles.filter(v => v.id !== id);
        saveVehiclesData(vehicles);
        renderAdminDashboard();
      }
    }

    // Generador de QR
    function generateQR(id) {
      const vehicles = getVehicles();
      const v = vehicles.find(item => item.id === id);
      if (!v) return;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      // Crear copia del vehículo sin foto pesada para compactar el QR
      const compactVehicle = { ...v, photo: '' };
      const jsonString = JSON.stringify(compactVehicle);
      const encodedData = btoa(unescape(encodeURIComponent(jsonString)));

      const baseUrl = window.location.origin + window.location.pathname;
      currentQrUrl = `${baseUrl}?data=${encodedData}`;

      new QRCode(qrContainer, {
        text: currentQrUrl,
        width: 140,
        height: 140,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
      });

      openModal('qrModal');
    }

    function openQrUrl() {
      if (currentQrUrl) {
        window.open(currentQrUrl, '_blank');
      }
    }

    function copyQrUrl() {
      if (currentQrUrl) {
        navigator.clipboard.writeText(currentQrUrl);
        alert('¡Enlace del vehículo copiado al portapapeles!');
      }
    }

    // Filtro de búsqueda
    function filterVehicles() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.vehicle-card');
      cards.forEach(card => {
        const text = card.getAttribute('data-search');
        if (text.includes(query)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }

    function resetToHome() {
      window.history.pushState({}, '', window.location.pathname);
      checkRoute();
    }
  </script>
</body>
</html>
